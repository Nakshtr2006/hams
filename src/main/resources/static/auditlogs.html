<!DOCTYPE html>
<html>

<head>

    <title>Audit Logs</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

    <h1>Audit Logs</h1>

    <div class="actions">

        <button
                data-testid="refresh-logs-button"
                onclick="loadLogs()">

            Refresh Logs

        </button>

        <button
                data-testid="dashboard-button"
                onclick="goBack()">

            Dashboard

        </button>

    </div>

    <p id="message"></p>

    <hr>

    <div
            id="logs"
            data-testid="logs-container">

    </div>

</div>

<script src="js/common.js"></script>
<script src="js/auditlogs.js"></script>

</body>

</html>
