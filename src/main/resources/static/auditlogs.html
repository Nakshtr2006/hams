<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Audit Logs | HAMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect"
          href="https://fonts.googleapis.com">
    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/auditlogs.css">
</head>

<body>

<div class="app-shell">

    <aside class="sidebar">

        <div>

            <a class="sidebar-brand" href="dashboard.html">
                <span class="sidebar-logo">H</span>

                <span>
                    <h4>HAMS</h4>
                    <small>Hierarchy Access Management</small>
                </span>
            </a>

            <nav class="sidebar-nav">
                <a class="sidebar-link" href="dashboard.html" data-nav="dashboard">
                    <i class="bi bi-speedometer2"></i>
                    Dashboard
                </a>

                <a class="sidebar-link" href="products.html" data-nav="products">
                    <i class="bi bi-box-seam"></i>
                    Products
                </a>

                <a class="sidebar-link" href="users.html" data-nav="users">
                    <i class="bi bi-people"></i>
                    Users
                </a>

                <a class="sidebar-link" href="auditlogs.html" data-nav="auditlogs">
                    <i class="bi bi-journal-text"></i>
                    Audit Logs
                </a>
            </nav>

        </div>

        <div class="profile">
            <span class="profile-avatar" id="profileInitials"></span>

            <div class="profile-copy">
                <strong id="profileName"></strong>
                <small id="profileRole"></small>
            </div>

            <button class="icon-button logout-button"
                    data-testid="logout-button"
                    onclick="logout()"
                    aria-label="Logout">
                <i class="bi bi-box-arrow-right"></i>
            </button>
        </div>

    </aside>

    <div class="sidebar-backdrop" onclick="toggleSidebar(false)"></div>

    <main class="main-content">

        <div class="content-wrapper">

            <div class="mobile-topbar">
                <div class="mobile-brand">
                    <span class="mobile-logo">H</span>
                    HAMS
                </div>

                <button class="icon-button"
                        onclick="toggleSidebar(true)"
                        aria-label="Open navigation">
                    <i class="bi bi-list"></i>
                </button>
            </div>

            <header class="page-header">
                <div>
                    <p class="eyebrow">Observability</p>
                    <h1 class="page-title">Audit Logs</h1>
                    <p class="page-subtitle">
                        Review recent product changes and system activity.
                    </p>
                </div>
            </header>

            <section class="toolbar">
                <div class="search-box">
                    <i class="bi bi-search"></i>

                    <input id="search"
                           type="text"
                           placeholder="Search audit logs...">
                </div>

                <div class="toolbar-group">
                    <button class="btn btn-outline-light"
                            data-testid="refresh-logs-button"
                            onclick="loadLogs()">
                        <i class="bi bi-arrow-clockwise"></i>
                        Refresh Logs
                    </button>

                    <button class="btn btn-ghost"
                            data-testid="dashboard-button"
                            onclick="goBack()">
                        <i class="bi bi-speedometer2"></i>
                        Dashboard
                    </button>
                </div>
            </section>

            <p id="message" class="message-line"></p>

            <section class="table-card">
                <div class="table-card-header">
                    <div>
                        <h2 class="table-card-title">Event Stream</h2>
                        <p class="table-card-subtitle">
                            Chronological view of recorded system events.
                        </p>
                    </div>
                </div>

                <div class="table-responsive audit-table-wrap">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>User</th>
                            <th>Action</th>
                            <th>Entity</th>
                            <th>Description</th>
                            <th>Result</th>
                        </tr>
                        </thead>

                        <tbody id="logs" data-testid="logs-container">
                        </tbody>
                    </table>
                </div>
            </section>

        </div>

    </main>

</div>

<div id="toastContainer"
     class="toast-container position-fixed top-0 end-0 p-3">
</div>

<script src="js/common.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auditlogs.js"></script>

</body>

</html>
