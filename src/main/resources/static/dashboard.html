<!DOCTYPE html>
<html>
<head>
    <title>HAMS Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <h1>HAMS Dashboard</h1>

    <h2 id="welcomeMessage"></h2>

    <h3 id="roleMessage"></h3>

    <hr>

    <div id="stats"></div>

    <hr>

    <button
            data-testid="products-button"
            onclick="goToProducts()">
        Products
    </button>

    <button
            data-testid="users-button"
            onclick="goToUsers()">
        Users
    </button>

    <button
            data-testid="auditlogs-button"
            onclick="goToAuditLogs()">
        Audit Logs
    </button>

    <button
            data-testid="logout-button"
            onclick="logout()">
        Logout
    </button>

</div>

<script src="js/common.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
