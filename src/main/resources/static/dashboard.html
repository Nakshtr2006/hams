<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | HAMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect"
          href="https://fonts.googleapis.com">
    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

<div class="app-shell">

    <aside class="sidebar">

        <div>

            <a class="sidebar-brand" href="dashboard.html">
                <span class="sidebar-logo">H</span>

                <span>
                    <h4>HAMS</h4>
                    <small>Hierarchy Access Management</small>
                </span>
            </a>

            <nav class="sidebar-nav">
                <a class="sidebar-link" href="dashboard.html" data-nav="dashboard">
                    <i class="bi bi-speedometer2"></i>
                    Dashboard
                </a>

                <a class="sidebar-link" href="products.html" data-nav="products">
                    <i class="bi bi-box-seam"></i>
                    Products
                </a>

                <a class="sidebar-link" href="users.html" data-nav="users">
                    <i class="bi bi-people"></i>
                    Users
                </a>

                <a class="sidebar-link" href="auditlogs.html" data-nav="auditlogs">
                    <i class="bi bi-journal-text"></i>
                    Audit Logs
                </a>
            </nav>

        </div>

        <div class="profile">
            <span class="profile-avatar" id="profileInitials"></span>

            <div class="profile-copy">
                <strong id="profileName"></strong>
                <small id="profileRole"></small>
            </div>

            <button class="icon-button logout-button"
                    data-testid="logout-button"
                    onclick="logout()"
                    aria-label="Logout">
                <i class="bi bi-box-arrow-right"></i>
            </button>
        </div>

    </aside>

    <div class="sidebar-backdrop" onclick="toggleSidebar(false)"></div>

    <main class="main-content">

        <div class="content-wrapper">

            <div class="mobile-topbar">
                <div class="mobile-brand">
                    <span class="mobile-logo">H</span>
                    HAMS
                </div>

                <button class="icon-button"
                        onclick="toggleSidebar(true)"
                        aria-label="Open navigation">
                    <i class="bi bi-list"></i>
                </button>
            </div>

            <header class="page-header">
                <div>
                    <p class="eyebrow" id="welcomeMessage"></p>
                    <h1 class="page-title">Command Center</h1>
                    <p class="page-subtitle" id="roleMessage"></p>
                </div>
            </header>

            <section id="stats" class="dashboard-grid"></section>

            <section class="dashboard-columns">

                <div class="activity-card">
                    <div class="section-heading">
                        <h2>Recent Activity</h2>

                        <button class="btn btn-outline-light btn-sm"
                                onclick="loadRecentLogs()">
                            <i class="bi bi-arrow-clockwise"></i>
                            Refresh
                        </button>
                    </div>

                    <div id="recentActivity" class="activity-list">
                        <div class="empty-state">Loading recent activity...</div>
                    </div>
                </div>

                <div class="quick-action-card">
                    <div class="section-heading">
                        <h2>Quick Actions</h2>
                    </div>

                    <div class="quick-actions-grid">
                        <button class="quick-action"
                                data-testid="products-button"
                                onclick="goToProducts()">
                            <span>
                                <i class="bi bi-box-seam"></i>
                                Products
                            </span>
                            <i class="bi bi-arrow-right"></i>
                        </button>

                        <button class="quick-action"
                                data-testid="users-button"
                                onclick="goToUsers()">
                            <span>
                                <i class="bi bi-people"></i>
                                Users
                            </span>
                            <i class="bi bi-arrow-right"></i>
                        </button>

                        <button class="quick-action"
                                data-testid="auditlogs-button"
                                onclick="goToAuditLogs()">
                            <span>
                                <i class="bi bi-journal-text"></i>
                                Audit Logs
                            </span>
                            <i class="bi bi-arrow-right"></i>
                        </button>
                    </div>
                </div>

            </section>

        </div>

    </main>

</div>

<div id="toastContainer"
     class="toast-container position-fixed top-0 end-0 p-3">
</div>

<script src="js/common.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/dashboard.js"></script>

</body>

</html>
