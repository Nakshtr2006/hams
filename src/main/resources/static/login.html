<!DOCTYPE html>
<html>
<head>
    <title>HAMS Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <h1>HAMS Login</h1>

    <input
            type="email"
            id="email"
            placeholder="Email"
    >

    <input
            type="password"
            id="password"
            placeholder="Password"
    >

    <button onclick="login()">
        Login
    </button>

    <p id="message"></p>

    <a href="signup.html">
        Create Account
    </a>

</div>

<script src="js/auth.js"></script>

</body>
</html>
